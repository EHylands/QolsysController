[project]
name = "qolsys-controller"
version = "1.12.3"
authors = [
  { name="Eric Hylands", email="" },
]
description = "A Python module that emulates a virtual IQ Remote device, enabling full local control of a Qolsys IQ Panel"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "License :: OSI Approved :: MIT License",
]
license = "MIT"
dependencies = [
    "aiofiles>=25.1.0",
    "aiomqtt>=2.5.1",
    "cryptography>=44.0.1,<=50.0.2",
    "passlib>=1.7.4",
    "zeroconf>=0.148.0",
]

[project.optional-dependencies]
bridge = [
    "amqtt>=0.10.0",
]
dev = [
    "mypy",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-md-report>=0.7",
    "ruff",
    "types-aiofiles",
]

[project.urls]
Homepage = "https://github.com/EHylands/QolsysController"
Issues = "https://github.com/EHylands/QolsysController/issues"
Repository = "https://github.com/EHylands/QolsysController.git"

[build-system]
requires = ["hatchling >= 1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qolsys_controller/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 127
target-version = "py312"


[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[project.scripts]
qolsys-controller = "qolsys_controller.cli:main"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_parser = "conventional"

# Per-branch release behavior. The release workflow (publish.yml) is dispatched
# from one of these branches; semantic-release picks stable vs beta from here.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.dev]
match = "dev"
prerelease = true
prerelease_token = "beta"


[tool.semantic_release.changelog]
file = "CHANGELOG.md"
# Use the vendored templates/ (copied from PSR's conventional/md set) so the
# changelog AND GitHub release notes get emoji section headings. This REPLACES
# PSR's bundled templates — re-sync templates/ when upgrading python-semantic-release.
template_dir = "templates"

[tool.semantic_release.remote]
name = "origin"
type = "github"
upload_to_release = true