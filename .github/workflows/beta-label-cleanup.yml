name: Remove beta label on merge to main

# Housekeeping for the beta track: once a feature actually ships (its PR is
# MERGED into main), its `beta` label is obsolete — drop it so the label marks
# only in-flight features. This keeps `gh pr list --label beta` (used by
# rebuild-dev.yml) accurate: a shipped PR is already closed and excluded, and
# removing the label avoids confusion in the PR list.
#
# pull_request_target (base-repo context, write-capable token) is used so the
# label can be removed even for PRs from forks. Safe here: no PR code is ever
# checked out or executed — we only call the GitHub API.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  remove-beta-label:
    name: Drop beta label
    runs-on: ubuntu-latest
    # Only when the PR was actually merged (not just closed) and still carries the label.
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'beta')
    steps:
      - name: Remove `beta` label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR" --repo "$REPO" --remove-label beta
          echo "Removed 'beta' label from merged PR #$PR."
