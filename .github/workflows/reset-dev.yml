name: Reset dev → main

# Resets the throwaway `dev` beta sandbox to `main`. Runs two ways:
#   - Manually (workflow_dispatch): click "Run workflow" in the Actions tab to
#     wipe dev back to main whenever you want a clean beta base.
#   - Automatically (workflow_call): invoked from publish.yml Stage 5 after a
#     STABLE release on main, so dev restarts from the just-released stable tag
#     and the NEXT beta computes the right version.
#
# This FORCE-pushes dev — any beta-only commits on dev are intentionally dropped.
# Re-apply the `beta` label (see beta-to-dev.yml) to merge wanted features back
# into the fresh dev.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

# Serialize resets so a manual run and the post-release auto run can't race two
# force-pushes onto dev.
concurrency:
  group: reset-dev
  cancel-in-progress: false

jobs:
  reset-dev:
    name: Reset dev → main
    runs-on: ubuntu-latest
    steps:
      # PAT (admin) so the force-push to the protected dev branch bypasses branch
      # rules — same rationale as the release job's push.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Reset dev to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # HEAD is main (after a release, including the version-bump commit + tag
          # the release job just pushed). Fetch dev so --force-with-lease has a
          # lease reference, then overwrite dev with main (dev is throwaway).
          git fetch origin dev
          git push --force-with-lease=dev origin HEAD:refs/heads/dev
          echo "Reset dev to main ($(git rev-parse --short HEAD))."
