name: Build

# Manual release. The maintainer picks WHEN to release by dispatching this
# workflow from the Actions tab and choosing the branch:
#   - main  -> cuts a STABLE version   (e.g. 1.13.0)
#   - dev   -> cuts a BETA pre-release (e.g. 1.13.0-beta.1 -> 1.13.0b1 on PyPI)
# The stable-vs-beta choice is driven entirely by the per-branch config in
# pyproject.toml ([tool.semantic_release.branches.*]) — not by logic here.
on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs on the same ref: two quick dispatches must not race two
# releases onto the same version/tags. Queue rather than cancel — never abort
# an in-flight release mid tag-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Stage 0 — guard. Releases are only valid from main (stable) or dev (beta).
  # Any other branch has no release group in pyproject.toml, so fail fast with
  # a clear message instead of a confusing semantic-release error.
  guard:
    name: Validate release branch
    runs-on: ubuntu-latest
    steps:
      - name: Only main or dev may release
        run: |
          if [ "${{ github.ref_name }}" != "main" ] && [ "${{ github.ref_name }}" != "dev" ]; then
            echo "::error::Releases may only be dispatched from 'main' (stable) or 'dev' (beta). Got '${{ github.ref_name }}'."
            exit 1
          fi
          echo "Releasing from '${{ github.ref_name }}'."

  # Stage 0.5 — refresh dev. A beta Build always contains the latest commit of
  # every open `beta` PR. Runs as a no-op on main rather than being skipped: a
  # skipped job would also skip every later job, including the PyPI publish.
  rebuild:
    name: Beta
    needs: guard
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/dev-rebuild.yml
    with:
      skip: ${{ github.ref_name != 'dev' }}
      fail_on_conflict: true
    secrets: inherit

  # Stage 1 — checks. Reuse the same lint + test pipeline that runs on every
  # push/PR so a release can never ship code that would fail CI. On dev, test
  # the branch tip: the dispatched commit predates the rebuild.
  checks:
    name: CI
    needs: [guard, rebuild]
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.ref_name == 'dev' && 'dev' || '' }}

  # Stage 2 — release. Only runs if the branch is valid and checks passed.
  release:
    name: Semantic Version + Tag
    runs-on: ubuntu-latest
    needs: [guard, checks]

    # Surface whether a new version was cut (and which tag) so the publish job
    # can decide whether to run and what ref to build.
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name == 'dev' && 'dev' || '' }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install semantic-release
        run: python -m pip install python-semantic-release

      # A dev rebuild drops the previous beta's tag from dev's history, and
      # semantic-release only counts tags reachable from HEAD, so it recomputes
      # the same beta version and stops with "already been released". Merge the
      # newest unshipped beta tag with -s ours (history only, no file changes) so
      # numbering continues from it.
      - name: Keep beta numbering across dev rebuilds
        if: github.ref_name == 'dev'
        run: |
          stable="$(git tag --merged HEAD --list 'v*' | grep -v -- '-beta' | sort -V | tail -1)"
          beta="$(git tag --list 'v*-beta.*' | sort -V | tail -1)"
          base="${beta%-beta.*}"

          # Only for a beta of a version newer than the last stable release
          if [ -n "$beta" ] && [ "$base" != "$stable" ] \
            && [ "$(printf '%s\n' "$base" "$stable" | sort -V | tail -1)" = "$base" ] \
            && ! git merge-base --is-ancestor "$beta" HEAD; then
            echo "Merging $beta into dev's history."
            git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              merge -s ours --no-edit "$beta"
          fi

      # Intentional: a PAT is used instead of the default GITHUB_TOKEN so
      # semantic-release can push the version-bump commit and tag back to a
      # protected main/dev. Do not "simplify" this to GITHUB_TOKEN.
      - name: Run semantic-release (bump + tag)
        id: release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # semantic-release creates a release commit only when there's
          # something to release, so a changed HEAD means a new version.
          BEFORE="$(git rev-parse HEAD)"
          semantic-release version
          AFTER="$(git rev-parse HEAD)"
          if [ "$BEFORE" != "$AFTER" ]; then
            git push --follow-tags
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          else
            echo "No new release; skipping tag push and publish."
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "## ℹ️ No release — nothing to publish" >> "$GITHUB_STEP_SUMMARY"
            echo "No conventional-commit changes since the last tag on \`${{ github.ref_name }}\`, so semantic-release cut no new version." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Stage 3 — publish. Only runs when release cut a new version. Builds from the
  # freshly created tag (not the triggering commit, which predates the bump) and
  # publishes to PyPI via trusted publishing (OIDC). Beta pre-release wheels go
  # to the same PyPI project; pip ignores them unless users pass --pre.
  publish:
    name: Build + Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Verify build
        run: ls -l dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Self-documenting release: show what shipped (version, PyPI + GitHub
      # release links, install line) on the run's Summary page. Only reached
      # after a successful publish. PyPI normalizes `-beta.N` -> `bN`, so derive
      # the PyPI version/link from the git tag (tag_format is `v{version}`).
      - name: Release summary
        env:
          TAG: ${{ needs.release.outputs.tag }}
          REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          VERSION="${TAG#v}"
          PYPI_VER="$(printf '%s' "$VERSION" | sed -E 's/-beta\.([0-9]+)/b\1/')"
          if [ "$REF" = "dev" ]; then
            KIND="🧪 Beta pre-release"
            INSTALL="pip install --pre qolsys-controller==${PYPI_VER}"
          else
            KIND="✅ Stable release"
            INSTALL="pip install qolsys-controller==${PYPI_VER}"
          fi
          {
            echo "## ${KIND}: \`${TAG}\`"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Version** | \`${VERSION}\` |"
            echo "| **PyPI** | <https://pypi.org/project/qolsys-controller/${PYPI_VER}/> |"
            echo "| **GitHub release** | ${SERVER}/${REPO}/releases/tag/${TAG} |"
            echo "| **Install** | \`${INSTALL}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Stage 5 — rebuild dev. In this model `dev` is a THROWAWAY beta sandbox, never
  # promoted: features ship via feature → main, and beta builds are assembled by
  # merging `beta`-labeled PRs into dev (see dev-add-beta.yml). After a STABLE
  # release on main, dev is reset to the new stable baseline and the still-open
  # `beta` PRs are re-merged so the beta track continues on top of the new stable
  # tag (and the NEXT beta computes the right version). Only runs for releases
  # dispatched from main. The logic lives in dev-rebuild.yml so it is ALSO runnable
  # manually from the Actions tab; here we invoke it via workflow_call.
  dev-rebuild:
    name: Dev
    needs: release
    if: github.ref_name == 'main' && needs.release.outputs.released == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/dev-rebuild.yml
    secrets: inherit
