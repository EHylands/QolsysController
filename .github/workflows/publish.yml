name: Build

# Manual release. The maintainer picks WHEN to release by dispatching this
# workflow from the Actions tab and choosing the branch:
#   - main  -> cuts a STABLE version   (e.g. 1.13.0)
#   - dev   -> cuts a BETA pre-release (e.g. 1.13.0-beta.1 -> 1.13.0b1 on PyPI)
# The stable-vs-beta choice is driven entirely by the per-branch config in
# pyproject.toml ([tool.semantic_release.branches.*]) — not by logic here.
on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs on the same ref: two quick dispatches must not race two
# releases onto the same version/tags. Queue rather than cancel — never abort
# an in-flight release mid tag-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Stage 0 — guard. Releases are only valid from main (stable) or dev (beta).
  # Any other branch has no release group in pyproject.toml, so fail fast with
  # a clear message instead of a confusing semantic-release error.
  guard:
    name: Validate release branch
    runs-on: ubuntu-latest
    steps:
      - name: Only main or dev may release
        run: |
          if [ "${{ github.ref_name }}" != "main" ] && [ "${{ github.ref_name }}" != "dev" ]; then
            echo "::error::Releases may only be dispatched from 'main' (stable) or 'dev' (beta). Got '${{ github.ref_name }}'."
            exit 1
          fi
          echo "Releasing from '${{ github.ref_name }}'."

  # Stage 1 — checks. Reuse the same lint + test pipeline that runs on every
  # push/PR so a release can never ship code that would fail CI.
  checks:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml

  # Stage 2 — release. Only runs if the branch is valid and checks passed.
  release:
    name: Semantic Version + Tag
    runs-on: ubuntu-latest
    needs: [guard, checks]

    # Surface whether a new version was cut (and which tag) so the publish job
    # can decide whether to run and what ref to build.
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install semantic-release
        run: python -m pip install python-semantic-release

      # Intentional: a PAT is used instead of the default GITHUB_TOKEN so
      # semantic-release can push the version-bump commit and tag back to a
      # protected main/dev. Do not "simplify" this to GITHUB_TOKEN.
      - name: Run semantic-release (bump + tag)
        id: release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # semantic-release creates a release commit only when there's
          # something to release, so a changed HEAD means a new version.
          BEFORE="$(git rev-parse HEAD)"
          semantic-release version
          AFTER="$(git rev-parse HEAD)"
          if [ "$BEFORE" != "$AFTER" ]; then
            git push --follow-tags
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          else
            echo "No new release; skipping tag push and publish."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  # Stage 3 — publish. Only runs when release cut a new version. Builds from the
  # freshly created tag (not the triggering commit, which predates the bump) and
  # publishes to PyPI via trusted publishing (OIDC). Beta pre-release wheels go
  # to the same PyPI project; pip ignores them unless users pass --pre.
  publish:
    name: Build + Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Verify build
        run: ls -l dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Stage 5 — back-merge. After a STABLE release on main, sync dev to main so
  # dev's baseline stays current and the NEXT beta computes the right version
  # (semantic-release reads tags reachable from the branch; without this the
  # new stable tag isn't in dev's history). Only runs for releases dispatched
  # from main. Fast-forwards when possible (the clean case: dev→main PRs use a
  # merge commit and dev has no newer work); otherwise attempts a merge commit
  # and fails loudly on conflict so you resolve it by hand — it never
  # force-pushes dev, so divergent dev work is never silently lost.
  sync-dev:
    name: Back-merge main → dev
    runs-on: ubuntu-latest
    needs: release
    if: github.ref_name == 'main' && needs.release.outputs.released == 'true'

    steps:
      # PAT (admin) so the push to the protected dev branch bypasses required
      # status checks — same rationale as the release job's push.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Merge main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev
          git checkout -B dev origin/dev
          if git merge --ff-only origin/main; then
            echo "Fast-forwarded dev to main."
          elif git merge --no-ff --no-edit origin/main; then
            echo "Merged main into dev with a merge commit."
          else
            git merge --abort || true
            echo "::error::Back-merge of main into dev hit a conflict (common with squash-merged dev→main PRs). Resolve manually: git checkout dev && git merge main && git push."
            exit 1
          fi
          git push origin HEAD:dev
