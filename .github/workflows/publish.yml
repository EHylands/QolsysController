name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Serialize runs on the same ref: two quick pushes to main must not race two
# releases onto the same version/tags. Queue rather than cancel — never abort
# an in-flight release mid tag-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Stage 1 — static checks. Lint + types must pass before anything else runs.
  lint:
    name: Ruff + MyPy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        # Install the package with its declared dependencies so CI resolves the
        # same version ranges users get. Extras: dev = lint/type/test tooling,
        # bridge = amqtt (needed to type-check qolsys_controller/mqtt_bridge).
        run: pip install -e ".[dev,bridge]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: MyPy check
        run: mypy .

  # Stage 2 — tests. Only runs if Stage 1 passed.
  test:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -e ".[dev,bridge]"

      - name: Pytest
        run: pytest

  # Stage 3 — release. Only runs if lint + tests passed.
  release:
    name: Semantic Version + Tag
    runs-on: ubuntu-latest
    needs: test

    # Surface whether a new version was cut (and which tag) so the publish job
    # can decide whether to run and what ref to build.
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install semantic-release
        run: python -m pip install python-semantic-release

      # Intentional: a PAT is used instead of the default GITHUB_TOKEN so
      # semantic-release can push the version-bump commit and tag back to a
      # protected main. Do not "simplify" this to GITHUB_TOKEN.
      - name: Run semantic-release (bump + tag)
        id: release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # semantic-release creates a release commit only when there's
          # something to release, so a changed HEAD means a new version.
          BEFORE="$(git rev-parse HEAD)"
          semantic-release version
          AFTER="$(git rev-parse HEAD)"
          if [ "$BEFORE" != "$AFTER" ]; then
            git push --follow-tags
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          else
            echo "No new release; skipping tag push and publish."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  # Stage 4 — publish. Only runs when release cut a new version. Builds from the
  # freshly created tag (not the triggering commit, which predates the bump) and
  # publishes to PyPI via trusted publishing (OIDC).
  publish:
    name: Build + Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Verify build
        run: ls -l dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1