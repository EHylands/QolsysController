name: Semantic Release Preview (PR)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Semantic Release Preview
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout full history (required for semantic-release)
      # ------------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Python setup
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # ------------------------------------------------------------
      # Install semantic-release
      # ------------------------------------------------------------
      - name: Install semantic-release
        run: pip install python-semantic-release

      # ------------------------------------------------------------
      # Evaluate the PR *as merged into main*, not main itself.
      # On pull_request, actions/checkout checks out the simulated merge
      # commit (PR + base) by default. Naming that HEAD 'main' satisfies
      # semantic-release's branch matching, so it analyzes the PR's own
      # commits and previews what merging this PR would actually release.
      # (The previous `git checkout main` reset to base main and ignored
      # the PR entirely, so every PR showed the same version.)
      # ------------------------------------------------------------
      - name: Evaluate PR as merged into main
        run: git checkout -B main

      # ------------------------------------------------------------
      # Get next version
      # ------------------------------------------------------------
      - name: Get next version
        run: |
          echo "## 📦 Semantic Release Preview" > preview.txt
          echo "" >> preview.txt
          echo "### Next Version" >> preview.txt
          semantic-release version --print >> preview.txt
          echo "" >> preview.txt

      # ------------------------------------------------------------
      # Generate changelog preview (no scopes required)
      # ------------------------------------------------------------
      - name: Generate changelog preview
        run: |
          echo "### Changelog Preview" >> preview.txt
          semantic-release changelog >> preview.txt || true
          echo "" >> preview.txt

      # ------------------------------------------------------------
      # Format PR comment
      # ------------------------------------------------------------
      - name: Build PR comment
        run: |
          cat preview.txt > comment.md

      # ------------------------------------------------------------
      # Post PR comment
      # ------------------------------------------------------------
      - name: Post comment on PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          filePath: comment.md